<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 10px;
        }

        .img-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .img-container img {
            border: 1px solid blueviolet;
        }
    </style>
</head>

<body>
    <div class="img-container">
        <div>
            <h1 style="text-align: center;">Original</h1>
            <img src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1 style="text-align: center;">Blur</h1>
            <img style="filter: blur(4px);" src="./images/pineapple.jpg" alt="">
        </div>


        <div>
            <h1 style="text-align: center;">Brightness (180%)</h1>
            <img style="filter: brightness(180%);" src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1 style="text-align: center;">Brightness (40%)</h1>
            <img style="filter: brightness(40%);" src="./images/pineapple.jpg" alt="">
        </div>


        <div>
            <h1 style="text-align: center;">Contrast (200%)</h1>
            <img style="filter: contrast(200%);" src="./images/pineapple.jpg" alt="">
        </div>

         <div>
            <h1 style="text-align: center;">Contrast (50%)</h1>
            <img style="filter: contrast(50%);" src="./images/pineapple.jpg" alt="">
        </div>


       <div>
        <h1>Drop shadow</h1>
         <img style="filter: drop-shadow(10px 10px 10px black);" src="./images/pineapple.jpg" alt="">
       </div>

        <div>
            <h1>Grayscale (100%)</h1>
            <img style="filter: grayscale(1)" src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1>Invert (100%)</h1>
            <img style="filter: invert(100%);" src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1>Opacity (30%)</h1>
            <img style="filter: opacity(0.3)" src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1>saturate(200%)</h1>
            <img style="filter: saturate(200%)" src="./images/pineapple.jpg" alt="">
        </div>

        <div>
            <h1>saturate(0)</h1>
            <img style="filter: saturate(0)" src="./images/pineapple.jpg" alt="">
        </div>
        
    </div>
</body>

</html>
