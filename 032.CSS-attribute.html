<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a[target] {
            color: red;
        }

        [class $='top'] {
            background-color: aqua;
        }

        [class |='right'] {
            background-color: red;
        }

        [class~='left'] {
            background-color: blueviolet;
            color: yellow;
        }

        [class ^='bottom'] {
            color: blue;
        }

        [class *= 'center']{
            background-color: brown;
            color: white;
        }
    </style>
</head>

<body>
    <a href="" target="_blank">Google</a>
    <a href="">Youtebe</a>
    <div style="border:  2px solid red; width: 100px;">
        <p class="top">Welcome</p>
        <p class="top-text">Hello world!</p>
        <p class="topcontent">Are you learning CSS?</p>
    </div>

    <div style="border:  2px solid red; width: 100px;">
        <h4 class="right">Name</h4>
        <h4 class="right-text">Name</h4>
        <h4 class="rightcontent">Name</h4>
    </div>


    <div style="border:  2px solid blueviolet; width: 100px;">
        <h4 class="left">Age</h4>
        <h4 class="left-text">Age</h4>
        <h4 class="leftcontent">Age</h4>
    </div>


    <div style="border:  2px solid blue; width: 100px;">
        <h4 class="bottom">Actor</h4>
        <h4 class="bottom-text">Actor</h4>
        <h4 class="bottomcontent">Actor</h4>
    </div>


    <div style="border:  2px solid brown; width: 100px;">
        <h4 class="center">Actor</h4>
        <h4 class="center-text">Actor</h4>
        <h4 class="centercontent">Actor</h4>
        <h4 class="content">Actor</h4>
    </div>


</body>

</html>
